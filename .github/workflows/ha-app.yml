# Home Assistant app in a real Supervisor (#442): installs deploy/homeassistant/tasmofleet into the Supervisor
# of the official Home Assistant devcontainer, starts it, checks /readyz and the backup/restore round trip
# (tools/ha-app-devcontainer-test.sh). Slow (pulls the Supervisor images) and privileged, so it never runs on
# pull requests: nightly and by hand. No secrets; the passwords in the script are fake. Not published anywhere.
name: ha-app

on:
  workflow_dispatch:
  schedule:
    - cron: "41 3 * * *"

permissions:
  contents: read

concurrency:
  group: ha-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  devcontainer:
    name: app in a Supervisor (devcontainer)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: ha
          platforms: linux/amd64
          load: true
          provenance: false
          tags: tasmofleet-ha:ci
          build-args: |
            VERSION=ci
            WITH_DECODER=false
          cache-from: type=gha
      - name: install, start, readyz, backup and restore in the Supervisor
        run: timeout 1500 tools/ha-app-devcontainer-test.sh tasmofleet-ha:ci
