# Container image for tasmofleet, published to ghcr.io/<owner>/tasmofleet.
#  - tag vX.Y.Z: called by ci.yml (job "publish") only after the RELEASE tier
#    passed on the tag; fails unless CHANGELOG.md has a "## X.Y.Z" section,
#    then builds and pushes :X.Y.Z and :latest (a pre-release tag
#    vX.Y.Z-suffix pushes only :X.Y.Z-suffix). Tags do not trigger this
#    workflow on their own.
#  - push to main: build and push :edge.
#  - pull requests that touch the Dockerfile or the module files: build only,
#    nothing is pushed (proves the Dockerfile still works).
# ghcr authentication is the workflow's GITHUB_TOKEN (packages: write). When the
# repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN exist, the same build
# is also pushed under the same tags to docker.io/<DOCKERHUB_USERNAME>/tasmofleet
# (no rebuild); without them (forks) that part is skipped.
# The image is a multi-arch manifest (linux/amd64 and linux/arm64) under every tag. The Go binary is
# cross-compiled on the amd64 runner (no emulation); the arm64 image carries the unofficial
# aarch64 decoder build (Dockerfile).
# Before anything is pushed, the arm64 image is built, loaded and started under QEMU (version, and
# the decoder decodes a real backup fixture).
# The Home Assistant app image (Dockerfile target "ha", deploy/homeassistant) is built and smoke-tested on
# every run but not pushed anywhere yet; publishing it comes with #444.
# Layers are cached in the GitHub Actions cache.
name: image

on:
  workflow_call:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "e2e/**"
      - "design/**"
      - "testdata/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/image.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: build image (push on main and tags)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: version and tags
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          image="ghcr.io/$(echo "$OWNER" | tr 'A-Z' 'a-z')/tasmofleet"
          push=false
          if [ "$REF_TYPE" = tag ]; then
            # Release images come only from ci.yml after the RELEASE tier passed.
            [ "$EVENT" = push ] || { echo "tag images are published by ci.yml (job publish), not by $EVENT" >&2; exit 1; }
            tag=$REF_NAME
            echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' || {
              echo "tag '$tag' is not vX.Y.Z" >&2
              exit 1
            }
            # Release guard: CHANGELOG.md must have the section for this tag.
            make changelog-check TAG="$tag"
            version=${tag#v}
            tags="$image:$version"
            case "$version" in *-*) ;; *) tags="$tags,$image:latest" ;; esac
            push=true
          elif [ "$EVENT" != pull_request ] && [ "$REF" = refs/heads/main ]; then
            version="edge-$(echo "$SHA" | cut -c1-12)"
            tags="$image:edge"
            push=true
          else
            version="pr-$(echo "$SHA" | cut -c1-12)"
            tags="$image:pr"
          fi
          # Same build, same tags on Docker Hub (edge included, so both registries match); only
          # when pushing and both secrets exist.
          dockerhub=false
          if [ "$push" = true ] && [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            dhimage="docker.io/$(echo "$DOCKERHUB_USERNAME" | tr 'A-Z' 'a-z')/tasmofleet"
            tags="$tags,$(echo "$tags" | sed "s|$image|$dhimage|g")"
            dockerhub=true
          fi
          echo "building $tags (version $version, push $push, dockerhub $dockerhub)"
          {
            echo "dockerhub=$dockerhub"
            echo "version=$version"
            echo "tags=$tags"
            echo "push=$push"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.7.0
        if: steps.v.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4.7.0
        if: steps.v.outputs.dockerhub == 'true'
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # edge is replaced on every push to main; remember the digest it points to now, so the step
      # after the push can delete exactly that manifest (product owner, 2026-10-30). Releases are
      # never deleted.
      - name: previous edge
        id: prev
        if: steps.v.outputs.push == 'true' && github.ref_type != 'tag'
        env:
          OWNER: ${{ github.repository_owner }}
          DOCKERHUB: ${{ steps.v.outputs.dockerhub }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -u
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty'; }
          # the per-platform manifests an index points to (space separated)
          kids() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -r '[.manifests[]?.digest] | join(" ")'; }
          ghcr="ghcr.io/$(echo "$OWNER" | tr 'A-Z' 'a-z')/tasmofleet"
          {
            echo "ghcr_edge=$(digest "$ghcr:edge")"
            echo "ghcr_edge_kids=$(kids "$ghcr:edge")"
            echo "ghcr_latest=$(digest "$ghcr:latest")"
            if [ "$DOCKERHUB" = true ]; then
              dh="docker.io/$(echo "$DOCKERHUB_USERNAME" | tr 'A-Z' 'a-z')/tasmofleet"
              echo "dh_edge=$(digest "$dh:edge")"
              echo "dh_edge_kids=$(kids "$dh:edge")"
              echo "dh_latest=$(digest "$dh:latest")"
            fi
          } >> "$GITHUB_OUTPUT"
      # Smoke check, before any push: the arm64 image starts. QEMU is used for this run only.
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/arm64
          load: true
          provenance: false
          tags: tasmofleet:smoke-arm64
          build-args: VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: arm64 smoke run
        run: |
          set -eu
          out=$(docker run --rm --platform linux/arm64 tasmofleet:smoke-arm64 version)
          echo "$out"
          # a successful run of the arm64 binary under QEMU is the check; the printed form of the
          # version differs per build kind (release, edge, pr), so it is not matched
          [ -n "$out" ]
          docker image inspect tasmofleet:smoke-arm64 --format '{{.Os}}/{{.Architecture}}' | grep -qx linux/arm64
          # The arm64 decoder (unofficial build, see the Dockerfile) decodes the synthetic backup of the
          # integration tests to exactly the JSON stored next to it (header.env is host info).
          fx=internal/backup/testdata/synthetic
          docker run --rm --platform linux/arm64 --entrypoint /usr/local/bin/decode-config \
            -v "$PWD/$fx/synthetic-15.6.0.3.dmp:/in/s.dmp:ro" tasmofleet:smoke-arm64 --version
          docker run --rm --platform linux/arm64 --entrypoint /usr/local/bin/decode-config \
            -v "$PWD/$fx/synthetic-15.6.0.3.dmp:/in/s.dmp:ro" tasmofleet:smoke-arm64 \
            --source /in/s.dmp --output-format json | jq -S 'del(.header.env)' > /tmp/decoded-arm64.json
          jq -S . "$fx/decoded.json" | diff - /tmp/decoded-arm64.json
      # Home Assistant app image (target "ha", deploy/homeassistant): started the way the Supervisor
      # starts it, with a fake SUPERVISOR_TOKEN and options.json (tools/ha-app-smoke.sh).
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: ha
          platforms: linux/amd64
          load: true
          provenance: false
          tags: tasmofleet-ha:smoke
          build-args: VERSION=${{ steps.v.outputs.version }}
          cache-from: type=gha
      - name: HA app image smoke run
        run: tools/ha-app-smoke.sh tasmofleet-ha:smoke
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.v.outputs.push == 'true' }}
          # No attestation manifests: the index lists the two platform images and nothing else.
          provenance: false
          tags: ${{ steps.v.outputs.tags }}
          build-args: VERSION=${{ steps.v.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Delete the manifest the old edge pointed to, unless edge did not move or latest still uses
      # it. A failure here only warns: the image is already published.
      - name: delete the previous edge
        if: steps.prev.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          DOCKERHUB: ${{ steps.v.outputs.dockerhub }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          GHCR_EDGE: ${{ steps.prev.outputs.ghcr_edge }}
          GHCR_EDGE_KIDS: ${{ steps.prev.outputs.ghcr_edge_kids }}
          DH_EDGE_KIDS: ${{ steps.prev.outputs.dh_edge_kids }}
          GHCR_LATEST: ${{ steps.prev.outputs.ghcr_latest }}
          DH_EDGE: ${{ steps.prev.outputs.dh_edge }}
          DH_LATEST: ${{ steps.prev.outputs.dh_latest }}
        run: |
          set -u
          digest() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' 2>/dev/null | jq -r '.digest // empty'; }
          owner=$(echo "$OWNER" | tr 'A-Z' 'a-z')
          ghcr="ghcr.io/$owner/tasmofleet"
          now=$(digest "$ghcr:edge")
          if [ -n "$GHCR_EDGE" ] && [ -n "$now" ] && [ "$GHCR_EDGE" != "$now" ] && [ "$GHCR_EDGE" != "$GHCR_LATEST" ]; then
            # the index first, then the platform manifests it listed
            for d in $GHCR_EDGE $GHCR_EDGE_KIDS; do
              id=$(gh api "/users/$owner/packages/container/tasmofleet/versions?per_page=100" --jq ".[] | select(.name == \"$d\") | .id")
              if [ -n "$id" ] && gh api -X DELETE "/users/$owner/packages/container/tasmofleet/versions/$id"; then
                echo "ghcr: deleted the previous edge manifest $d"
              else
                echo "::warning::ghcr: could not delete the previous edge manifest $d"
              fi
            done
          fi
          if [ "$DOCKERHUB" = true ]; then
            user=$(echo "$DOCKERHUB_USERNAME" | tr 'A-Z' 'a-z')
            now=$(digest "docker.io/$user/tasmofleet:edge")
            if [ -n "$DH_EDGE" ] && [ -n "$now" ] && [ "$DH_EDGE" != "$now" ] && [ "$DH_EDGE" != "$DH_LATEST" ]; then
              token=$(curl -fsS -u "$DOCKERHUB_USERNAME:$DOCKERHUB_TOKEN" \
                "https://auth.docker.io/token?service=registry.docker.io&scope=repository:$user/tasmofleet:pull,push,delete" | jq -r .token)
              for d in $DH_EDGE $DH_EDGE_KIDS; do
                code=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE -H "Authorization: Bearer $token" \
                  "https://registry-1.docker.io/v2/$user/tasmofleet/manifests/$d")
                case "$code" in
                  202 | 200) echo "Docker Hub: deleted the previous edge manifest $d" ;;
                  *) echo "::warning::Docker Hub: deleting the previous edge manifest $d answered $code" ;;
                esac
              done
            fi
          fi
      # The Docker Hub overview follows deploy/dockerhub/README.md with every release.
      - name: Docker Hub overview
        if: steps.v.outputs.dockerhub == 'true' && github.ref_type == 'tag'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          user=$(echo "$DOCKERHUB_USERNAME" | tr 'A-Z' 'a-z')
          jwt=$(jq -n --arg u "$DOCKERHUB_USERNAME" --arg p "$DOCKERHUB_TOKEN" '{username:$u,password:$p}' |
            curl -fsS -H 'Content-Type: application/json' -d @- https://hub.docker.com/v2/users/login | jq -r .token)
          jq -n --rawfile fd deploy/dockerhub/README.md \
            --arg d 'Self-hosted fleet manager for Tasmota devices: backups, policy, safe bulk firmware updates' \
            '{full_description:$fd, description:$d}' |
            curl -fsS -o /dev/null -X PATCH -H "Authorization: JWT $jwt" -H 'Content-Type: application/json' -d @- \
              "https://hub.docker.com/v2/repositories/$user/tasmofleet/"
